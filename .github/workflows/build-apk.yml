name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw version string: $JAVA_VERSION_OUTPUT"
          
          # Extract major version number
          MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          
          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version is $MAJOR_VERSION, which is lower than the required Java 17."
            exit 1
          fi
          echo "Java environment verified successfully (version $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK."
            echo "Listing files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Discovered APK is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Debug APK verified successfully at $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          
          # Sanitize repository name (e.g. owner/repo -> repo, alphanumeric & hyphens only)
          REPO_NAME=$(basename "${{ github.repository }}" | tr -cd '[:alnum:]_-' | tr '[:upper:]' '[:lower:]')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "$SOURCE_APK" "$DEST_APK"
          
          if [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          
          echo "Release asset prepared: $DEST_APK ($ASSET_NAME)"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset not found or empty: $ASSET_PATH"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Nirmaladevi Care - Automated Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ---
          > ⚠️ **Notice:** This APK is intended for testing and internal distribution only. It is signed with a temporary debug keystore and is **not** a production release for the Google Play Store.

          #### Direct Download:
          Download \`${ASSET_NAME}\` from the Assets section below.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "============================================="
          echo "          BUILD & RELEASE SUMMARY            "
          echo "============================================="
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release Asset: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Build & Release Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** ${RELEASE_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download Page:** [View GitHub Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Release APK Asset:** \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 **How to download on your phone:** Open the release link above, scroll to the **Assets** section, and tap on \`${ASSET_NAME}\` to download and install." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available under the workflow Summary page." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue."
            echo "However, the debug APK was built successfully and uploaded as an Actions artifact."
            echo "Artifact Name: app-debug-apk"
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Notice)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build Status:** ✅ Successful" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Actions Artifact:** \`app-debug-apk\` is available under the workflow run Summary." >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Release Status:** Publishing encountered an issue or was skipped, but the APK artifact is preserved and ready for download." >> $GITHUB_STEP_SUMMARY
          fi
